# Keeps the scheduled workflows on. GitHub disables a public repository's schedules after 60 days
# without activity, so once a month this commits the live road build's manifest (public data from
# tiles.routeall.app) to status/roads-build.json, and nothing else. It is the only job that may
# write to the repository; the data jobs hold contents: read and the bucket tokens, this one holds
# no bucket token.

name: Keepalive

on:
  schedule:
    - cron: '41 9 3 * *' # the 3rd of each month, 09:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: status

      - name: Record the live road build
        run: |
          mkdir -p status
          curl -fsS "https://tiles.routeall.app/roads/current.json?run=$GITHUB_RUN_ID" | node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync(0)), null, 1) + "\n")' > status/roads-build.json

      # An unchanged manifest still makes an (empty) commit: the commit is the activity.
      - name: Commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- status/roads-build.json
          git commit --allow-empty -m "Keepalive: live road build $(node -p "require('./status/roads-build.json').buildId")"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
