# Keeps the scheduled workflows on. GitHub disables a public repository's schedules after 60 days
# without activity; enabling a workflow through the API resets that clock. Once a month this
# re-enables every workflow in the repository, this one included. It writes nothing to the code and
# holds no bucket token: its only permission is actions: write.

name: Keepalive

on:
  schedule:
    - cron: '41 9 3 * *' # the 3rd of each month, 09:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Re-enable every workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$REPO/actions/workflows" --paginate -q '.workflows[].id'); do
            gh api -X PUT "repos/$REPO/actions/workflows/$id/enable"
          done
          echo "re-enabled $(gh api "repos/$REPO/actions/workflows" -q '.total_count') workflows"
