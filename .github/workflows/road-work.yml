# Hourly road work and closures (roads/events.mjs).
#
# Reads USDOT's WZDx feed registry and Caltrans' 12 districts, keeps each feed's full normalized
# snapshot, applies the display window every run, and publishes immutable objects, then a
# versioned manifest, then events/v2/current.json last, inside a one-writer lock. The v1 files
# older app versions read are written after that. Clean-up (mark and sweep) runs in the same lock.
#
# Secrets (only on the refresh step):
#   R2_S3_ENDPOINT
#   EVENTS_R2_ACCESS_KEY_ID / EVENTS_R2_SECRET_ACCESS_KEY   R2 token: Object Read & Write, public tiles bucket only
#   WZDX_KEYS (optional)   JSON of registry feed name → API key, for the feeds that need one

name: Road Work

on:
  schedule:
    - cron: '17 * * * *' # hourly at :17, off the congested top of the hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: road-work
  cancel-in-progress: false

jobs:
  road-work:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: roads
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: roads

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --omit=dev

      - name: Refresh and publish road work
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.EVENTS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.EVENTS_R2_SECRET_ACCESS_KEY }}
          WZDX_KEYS: ${{ secrets.WZDX_KEYS }}
        run: node events.mjs
