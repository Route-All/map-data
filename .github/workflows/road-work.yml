# Hourly road work and closures (roads/events.mjs).
#
# Reads USDOT's WZDx feed registry and Caltrans' 12 districts, keeps each feed's full normalized
# snapshot, applies the display window every run, and publishes immutable objects, then a
# versioned manifest, then events/v2/current.json last, inside a one-writer lock. The v1 files
# older app versions read are written after that. Clean-up (mark and sweep) runs in the same lock.
#
# Secrets (only on the refresh step):
#   R2_S3_ENDPOINT
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY   R2 token: Object Read & Write, public tiles bucket only
#   WZDX_KEYS (optional)   JSON of registry feed name → API key, for the feeds that need one
#
# Hourly in practice: GitHub ran the ':17' schedule only every 4-6.5 h (2026-10-30/31), so road work
# went 6 h stale. Each run now waits for the next :17 and queues the next run itself with its own
# GITHUB_TOKEN (workflow_dispatch is one of the events that token may start). The schedule stays as
# the backstop that restarts the chain, and a run queues the next only when no other run is waiting,
# so there is never more than one chain. Public repo: the waiting minutes cost nothing.

name: Road Work

on:
  schedule:
    - cron: '17 * * * *' # hourly at :17, off the congested top of the hour
  workflow_dispatch:
    inputs:
      next_in:
        description: Seconds until the next run is queued (blank = the next :17)
        required: false

permissions: {}

concurrency:
  group: road-work
  cancel-in-progress: false

jobs:
  road-work:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # queue the next hour's run
    timeout-minutes: 80
    defaults:
      run:
        working-directory: roads
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: roads

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --omit=dev

      - name: Refresh and publish road work
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          WZDX_KEYS: ${{ secrets.WZDX_KEYS }}
        run: node events.mjs
      - name: Queue the next hour
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_IN: ${{ inputs.next_in }}
        run: |
          now=$(date -u +%s)
          wait=${NEXT_IN:-$(( ( (now - 17 * 60) / 3600 + 1) * 3600 + 17 * 60 - now ))}
          echo "Next run queued in ${wait}s"
          sleep "$wait"
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow road-work.yml -L 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\" or .status == \"in_progress\"))] | length")
          if [ "$others" = 0 ]; then gh workflow run road-work.yml -R "$GITHUB_REPOSITORY" --ref main; echo "Queued the next run"
          else echo "Another run is already waiting; it carries the chain"; fi
