# Daily roads and places (roads/build.sh, roads/pois.mjs).
#
# Asks Geofabrik first (roads/source-check.mjs) and builds only when a state has a newer extract
# than the live build, so a new extract goes live within a day. Then cuts every US state + DC into
# road tiles (v1, and v2: road tile v3 in 2° packs read by byte range), the state-boundary grid and place tiles and publishes them through R2's S3 API (roads/publish.mjs): tiles
# first, then build.json, then <kind>/current.json last, inside a one-writer lock. Any failed step
# stops the job before the pointer moves, and GitHub emails the failure.
#
# Secrets (only on the publish step):
#   R2_S3_ENDPOINT                                    the account's R2 S3 endpoint
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY   R2 token: Object Read & Write, public tiles bucket only

name: Roads

on:
  schedule:
    - cron: '23 7 * * *' # daily 07:23 UTC, off the top of the hour
  workflow_dispatch:
    inputs:
      force:
        description: Build even if Geofabrik has nothing newer
        type: boolean
        default: false

permissions: {}

concurrency:
  group: roads
  cancel-in-progress: false

jobs:
  roads:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # About 45-80 min to build; the S3 upload sends only changed tiles.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: roads
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Is there a newer extract?
        id: source
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${FORCE:-false}" = true ]; then node source-check.mjs --force; else node source-check.mjs; fi >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.source.outputs.newer == 'true'
        run: npm ci --omit=dev && (cd ../format && npm ci --omit=dev)

      - name: Tests
        if: steps.source.outputs.newer == 'true'
        run: npm test && (cd ../format && npm test)

      # The largest downloads (California, Texas) and their working copies need more than the
      # ~14 GB a runner starts with; these preinstalled toolchains are never used here.
      - name: Free disk
        if: steps.source.outputs.newer == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install osmium
        if: steps.source.outputs.newer == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Build tiles
        if: steps.source.outputs.newer == 'true'
        run: ./build.sh

      # v1 roads and places go live first: a v2 or boundary failure below must never hold back the
      # daily road update the app reads today.
      - name: Publish roads (v1), then places
        if: steps.source.outputs.newer == 'true'
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node publish.mjs && KIND=pois node publish.mjs

      # The state-boundary grid (format/stateBoundary.mjs) from Census TIGER/Line; unchanged blocks keep their hash.
      - name: Build state boundaries
        if: steps.source.outputs.newer == 'true'
        run: node boundaries.mjs .build

      - name: Publish roads (v2), then boundaries
        if: steps.source.outputs.newer == 'true'
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: KIND=roads2 node publish.mjs && KIND=boundaries node publish.mjs

      # Proves THIS run went live, not just that some pointer exists. The query string skips the
      # edge cache. Reads only the public domain.
      - name: Both builds are live
        if: steps.source.outputs.newer == 'true'
        run: |
          for kind in roads pois; do
            file=.build/build.json; [ "$kind" = pois ] && file=.build/pois.json
            want=$(node -p "require('./$file').buildId")
            live=$(curl -fsS "https://tiles.routeall.app/$kind/current.json?run=$GITHUB_RUN_ID" | node -p "JSON.parse(require('fs').readFileSync(0)).buildId")
            echo "$kind: built $want, live $live"
            [ "$want" = "$live" ] || { echo "::error::$kind/current.json still points at $live"; exit 1; }
          done
          for pair in roads/v2:.build/manifest2.json boundaries/v1:.build/boundaries/manifest.json; do
            prefix=${pair%%:*}; file=${pair#*:}
            want=$(node -p "require('./$file').buildId")
            live=$(curl -fsS "https://tiles.routeall.app/$prefix/current.json?run=$GITHUB_RUN_ID" | node -p "JSON.parse(require('fs').readFileSync(0)).buildId")
            echo "$prefix: built $want, live $live"
            [ "$want" = "$live" ] || { echo "::error::$prefix/current.json still points at $live"; exit 1; }
          done
          # Road tiles v2: the live manifest is the one the pointer names (SHA-256), and one block manifest and one tile
          # head read back by byte range match the hashes listed for them.
          node --input-type=module -e "
            const get = async (p, init) => { const r = await fetch('https://tiles.routeall.app/' + p, init); if (!r.ok) throw new Error(r.status + ' ' + p); return new Uint8Array(await r.arrayBuffer()); };
            const hex = async (b) => Buffer.from(await crypto.subtle.digest('SHA-256', b)).toString('hex');
            const ptr = JSON.parse(Buffer.from(await get('roads/v2/current.json?run=$GITHUB_RUN_ID')));
            const m = await get(ptr.manifest);
            if (ptr.schema !== 3 || (await hex(m)) !== ptr.sha256) throw new Error('roads/v2 manifest does not match its pointer');
            const ref = Object.values(JSON.parse(Buffer.from(m)).blocks)[0], block = await get(ref.key);
            if ((await hex(block)) !== ref.sha256) throw new Error(ref.key + ' does not match its hash');
            const [key, t] = Object.entries(JSON.parse(Buffer.from(block)).tiles)[0];
            const head = await get(t.key, { headers: { range: 'bytes=' + t.offset + '-' + (t.offset + t.head - 1) } });
            if (head.length !== t.head || (await hex(head)) !== t.headSha256) throw new Error('tile ' + key + ' head read by range does not match');
            console.log('roads/v2: manifest, block ' + ref.key + ' and the head of tile ' + key + ' read back and match');
          "
